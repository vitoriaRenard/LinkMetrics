<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkMetrics - Estatísticas</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
        }

        .short-link {
            color: #2563eb;
            font-size: 18px;
            word-break: break-all;
        }

        .original {
            color: #666;
            word-break: break-all;
            margin-top: 10px;
        }

        .click-box {
            text-align: center;
            margin: 30px 0;
            padding: 25px;
            background: #f7f8fa;
            border-radius: 15px;
        }

        .click-number {
            font-size: 48px;
            font-weight: bold;
            margin-top: 10px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            flex: 1;
            min-width: 180px;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            background: #222;
            color: white;
        }

        .button.secondary {
            background: #e9ecef;
            color: #222;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>📊 Estatísticas do seu link</h1>

        <p>
            Seu link encurtado:
        </p>

        <div class="short-link">
            http://127.0.0.1:8080/{{ link[0] }}
        </div>

        <p class="original">
            URL original: {{ link[1] }}
        </p>

        <div class="click-box">

            <div>👆 Cliques</div>

            <div class="click-number">
                {{ link[2] }}
            </div>

        </div>

        <div class="buttons">

            <a
                href="/stats/{{ link[0] }}"
                class="button"
            >
                🔄 Atualizar estatísticas
            </a>

            <a
                href="/dashboard"
                class="button secondary"
            >
                📊 Dashboard
            </a>

        </div>

    </div>

</div>

</body>

</html>
